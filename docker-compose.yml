version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandate_gateway_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mandate_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandate_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional backend container for containerized deployments
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mandate_gateway_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mandate_gateway
      SESSION_SECRET: production-grade-session-secret-at-least-32-chars-long!
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
      PAYPAL_MODE: sandbox
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    driver: local
